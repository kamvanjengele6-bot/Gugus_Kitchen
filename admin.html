<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Edit Menu – Gugu's Kitchen</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <!-- ===== Shared admin header ===== -->
    <header class="admin-header">
      <div class="header-content">
        <h1 class="admin-title">Gugu's Kitchen <span>Admin</span></h1>
        <nav class="admin-nav">
          <a href="admin.html" class="active">Edit Menu</a>
          <a href="ordersAdmin.html">View Orders</a>
          <a href="iv.html">Inventory</a>
          <a href="report.html">Reports</a>
          <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
      </div>
    </header>

    <main>
      <!-- Refresh lives here, outside the nav -->
      <div class="page-toolbar">
        <button type="button" class="refresh-btn" data-refresh="fetchMenu">
          ↻ Refresh Menu
        </button>
      </div>

      <!-- Add New Item -->
      <section class="admin-section">
        <h2>Add New Menu Item</h2>
        <form id="addItemForm" class="add-item-form">
          <input type="text" id="name" placeholder="Item Name" required />
          <input
            type="text"
            id="description"
            placeholder="Description"
            required
          />
          <input
            type="number"
            id="price"
            placeholder="Price"
            step="0.01"
            min="0"
            required
          />
          <input type="text" id="category" placeholder="Category" required />
          <input
            type="text"
            id="imageUrl"
            placeholder="Image URL / bucket path"
            required
          />
          <!-- Upload isn't wired to a backend yet; the URL field above is what gets saved -->
          <label class="file-field" for="image">
            <span>Optional: choose an image</span>
            <input id="image" name="image" type="file" accept="image/*" />
          </label>

          <button type="submit" class="btn-primary">Add Item</button>
        </form>
      </section>

      <!-- Menu Management -->
      <section class="admin-section">
        <h2>Manage Menu Items</h2>
        <div id="adminMenuItems" class="menu-items">
          <!-- Items with Update & Delete buttons are loaded by admin.js -->
        </div>
      </section>
    </main>

    <footer class="admin-footer">
      <p>© 2023 Gugu's Kitchen. Admin Panel.</p>
    </footer>

    <script src="admin-nav.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
